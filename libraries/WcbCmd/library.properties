name=WcbCmd
version=0.5.0
author=Greg Hulette
maintainer=Greg Hulette
sentence=Shared WCB command translators (device command -> native wire bytes).
paragraph=One command vocabulary for the whole WCB (Wireless Communication Board) ecosystem. Turns the WCB ";"-command verbs (;M Maestro, ;A MP3, ;L WLED, ;H HCR) into each device's native serial wire protocol, identically on any board. Compiled by BOTH the WCB firmware and a WCB_Client host (e.g. NaviCore) so the SAME command produces the SAME device bytes whether it is reached across the mesh over ESP-NOW (a WCB parses it) or out a host-local serial port (the host parses it). The library is pure translation (verb/action -> native bytes on an injected Stream); all routing, config, NVS and ESP-NOW relay stay in the firmware. Ships the Maestro (;M), MP3 (;A), WLED (;L) and HCR (;H) modules.
category=Device Control
