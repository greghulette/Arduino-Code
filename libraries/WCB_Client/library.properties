name=WCB_Client
version=1.13.2
author=Greg Hulette
maintainer=Greg Hulette
sentence=Client library for joining a Wireless Communication Board (WCB) ESP-NOW network.
paragraph=Allows any ESP32-based device to participate as a native peer in a WCB network. Supports unicast and broadcast text commands with automatic fragmentation for long commands (e.g. saving large stored sequences), raw binary forwarding for Pololu/Maestro servo packets via WCBStream, ETM heartbeat and ACK tracking, board online/offline status callbacks, and communication with an out-of-band special peer such as NaviCore via enableSpecialPeer(). A raw-packet hook (onRawPacket/sendRawPacket) lets custom protocols — such as firmware OTA — ride the same ESP-NOW mesh. setIdentity() advertises the device over WDP so WCBs discover it by name and firmware version automatically (the mesh twin of the serial WDP-DA device-announce model), setPortLabel() advertises this device's own per-serial-port labels (the WDP PORTLABEL TLV) so the Wizard and WCBs show what is attached to each of its ports, setMaestroIds() advertises the Maestro controllers this device hosts (the WDP MAESTRO and MAESTRO_CFG TLVs) so WCBs learn where they live and can route to them, and onNeighbor()/getNeighbor() consume the same WDP adverts to learn every WCB and client on the mesh — alias, firmware, capabilities, controller link and Maestro IDs. With auto-join (on by default) the device also registers regular WCBs it hears as ESP-NOW peers live and remembers them across reboots, so it discovers the fleet once and never needs wcb_quantity to cover it. A bulk-transfer facility (onBulkBegin/onBulkChunk/onBulkComplete) streams payloads too large to hold in RAM to consumer-owned storage with a selective-NACK back-channel, and inbound COMMANDs are de-duplicated by sequence number. Per-peer delivery statistics (getPeerStats/getAggregateStats/getBroadcastSent/resetStats) accumulate sent, ackd, retries, failed and unguaranteed counts for the ETM COMMAND layer, so a host can see which mesh links are healthy and which are retrying or failing.
